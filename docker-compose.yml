services:
  aegis-db:
    image: mysql:8.0
    container_name: aegis-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aegischat_db
      MYSQL_USER: aegis_user
      MYSQL_PASSWORD: aegis_password
    ports:
      - "3307:3306"
    volumes:
      - aegis_mysql_data:/var/lib/mysql
    networks:
      - aegis-network

  aegis-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aegis-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: aegis_guest
      RABBITMQ_DEFAULT_PASS: aegis_guestpass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - aegis_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - aegis-network

  aegis-minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: aegis-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aegis_minio_admin
      MINIO_ROOT_PASSWORD: aegis_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aegis_minio_data:/data
    networks:
      - aegis-network

volumes:
  aegis_mysql_data:
  aegis_rabbitmq_data:
  aegis_minio_data:

networks:
  aegis-network:
    driver: bridge